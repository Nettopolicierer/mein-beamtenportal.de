name: Webinar Reminders

# Ruft stündlich api/webinar-reminder auf. Der Endpoint selbst entscheidet
# anhand von REMINDER_STAGES (src/lib/webinar-config.ts), ob gerade eine
# Erinnerungsstufe fällig ist, und verschickt in dem Fall über Mailjet an
# alle Kontakte der Webinar-Kontaktliste.
#
# Hinweis: GitHub startet geplante Läufe unregelmäßig (teils erst nach Stunden).
# Der Endpoint toleriert das (Stufen gelten ab ihrem Zeitpunkt bis zu einer
# Toleranz, Doppelversand wird per Mailjet-CustomID verhindert). Für die
# Stufe "1 Stunde vorher" reicht das nur mit einem pünktlichen Takt - dafür
# zusätzlich einen externen Cron-Dienst (z. B. cron-job.org, alle 10 Minuten)
# auf https://www.mein-beamtenportal.de/api/webinar-reminder mit dem Header
# "Authorization: Bearer <CRON_SECRET>" einrichten.
#
# Läuft als GitHub Actions statt Vercel-Cron, weil der Vercel-Hobby-Plan nur
# tägliche Crons erlaubt (gleicher Grund wie bei blog-autopilot.yml).
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reminder-endpoint-aufrufen:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Ohne Secret wird der Lauf übersprungen statt rot zu laufen — gleiches
      # Prinzip wie beim Blog-Autopilot, damit ein fehlendes Secret nicht
      # stündlich eine Fehlermail auslöst.
      - name: CRON_SECRET prüfen und Endpoint aufrufen
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET ist nicht gesetzt – Lauf wird übersprungen. Secret unter Settings > Secrets and variables > Actions hinterlegen."
            exit 0
          fi

          # Kanonische Domain direkt ansteuern: mein-beamtenportal.de (ohne www)
          # leitet per 308 auf www um, und curl reicht den Authorization-Header
          # über einen Host-Wechsel nicht weiter. Falls die kanonische Domain
          # in Vercel wieder geändert wird, hier mitziehen.
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            "https://www.mein-beamtenportal.de/api/webinar-reminder" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "HTTP $http_code"
          cat response.json

          # Auch 3xx ist ein Fehler: eine Weiterleitung bedeutet, dass der
          # Endpoint gar nicht erreicht wurde.
          if [ "$http_code" -ge 300 ]; then
            echo "::error::webinar-reminder Endpoint antwortete mit HTTP $http_code (erwartet: 200)"
            exit 1
          fi
