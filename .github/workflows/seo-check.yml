name: SEO-Check

on:
  pull_request:
    paths:
      - "src/content-posts.json"
      - "migration/**"
  push:
    branches: [main]
    paths:
      - "src/content-posts.json"
      - "migration/**"
  workflow_dispatch: {}

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/seo_check.py
